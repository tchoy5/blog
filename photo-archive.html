<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog | Photo Archive</title>
    <link rel="stylesheet" href="style_clean.css">
</head>
<body class="gallery-page">
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="archive.html">Archive</a>
            <a href="about.html">About</a>
            <a href="photo-archive.html">Photos</a>
        </nav>
        <h1>Photo Archive</h1>
    </header>

    <main>
        <section id="photo-grid">
            <div class="photo-item" onclick="openLightbox('photos/DSC02217.jpeg', 'Caption for photo 1')">
                <img src="photos/DSC02217.jpeg" alt="Description of photo 1">
                <p>Caption for photo 1</p>
            </div>
            
            <div class="photo-item" onclick="openLightbox('images/photo1.jpg', 'Caption for photo 1')">
                <img src="images/photo2.jpg" alt="Description of photo 2">
                <p>Caption for photo 2</p>
            </div>
            <!-- Add more photo items here -->
        </section>
    </main>
    
    <!-- The Lightbox Overlay -->
    <div id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="">
        <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>

    <footer style="margin-top: 4rem;">
        <p><a href="index.html">← Back to Home</a></p>
        <p>&copy; 2026 My Blog</p>
    </footer>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCap = document.getElementById('lightbox-caption');

        function openLightbox(imgSrc, caption) {
            lightboxImg.src = imgSrc;
            lightboxCap.innerText = caption;
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            lightbox.style.display = 'none';
        }

        // Close lightbox when pressing the "Esc" key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });
    </script>
</body>
</html>
